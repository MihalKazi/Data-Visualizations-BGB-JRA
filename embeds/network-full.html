<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tracing the Coordinated Network Hour by Hour</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Sans+Bengali:wght@400;600;700&display=swap">
<style>
  :root {
    color-scheme: light;
    --surface: #faf8f4;
    --ink: #15171a;
    --ink-2: #5a6163;
    --muted: #979c9c;
    --hairline: #e9e5dd;
    --border: rgba(17,19,20,0.12);
    --bgb: #6b7b7d;
    --jra: #74060c;
    --both: #111314;
    --edge-bgb: #2f3b3d;
    --edge-jra: #5a1216;
    --edge-both: #15171a;
    --edge-alpha: 0.27;
    --halo: 0.09;
    --paper: #fffdf9;
    --rule: #dcd6ca;
    --card-shadow: 0 14px 34px rgba(70, 50, 20, 0.13), 0 1px 3px rgba(70, 50, 20, 0.10);
    --tip-bg: #ffffff;
    --tip-shadow: 0 6px 22px rgba(0,0,0,0.16);
    /* the four narratives of the copied texts, tinting each cluster's halo (validated: CVD-safe on this surface) */
    --n-attack: #c27a1a; --n-dg: #2f6db3; --n-july: #2e8b62; --n-story: #8a5cb0; --n-praise: #8f9393;
    --nar-halo: 0.17;
    --spark: #d99a00;
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --surface: #141515;
    --ink: #f1f2f2;
    --ink-2: #c1c7c8;
    --muted: #8a9294;
    --hairline: #2b2e2e;
    --border: rgba(255,255,255,0.14);
    --bgb: #93a2a4;
    --jra: #c8373d;
    --both: #f1f2f2;
    --edge-bgb: #aab6b8;
    --edge-jra: #d8666b;
    --edge-both: #f1f2f2;
    --edge-alpha: 0.24;
    --halo: 0.14;
    --paper: #1e1f1f;
    --rule: #3a3c3c;
    --card-shadow: 0 14px 34px rgba(0, 0, 0, 0.55);
    --tip-bg: #222424;
    --tip-shadow: 0 6px 22px rgba(0,0,0,0.6);
    --n-attack: #b9802f; --n-dg: #5a8ad0; --n-july: #3fa577; --n-story: #a077c8; --n-praise: #7d8486;
    --nar-halo: 0.2;
    --spark: #f2c14e;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--surface); }
  body { font-family: Inter, "Noto Sans Bengali", system-ui, -apple-system, "Segoe UI", sans-serif; color: var(--ink); -webkit-text-size-adjust: 100%; }
  .chart { position: relative; max-width: 1200px; margin: 0 auto; }
  svg { display: block; width: 100%; height: auto; touch-action: pan-y; }

  /* lines: thin and faint, spread over several layers so crossings add up to a dark bundle */
  .edges { fill: none; stroke-width: 0.5; stroke-opacity: var(--edge-alpha); }
  /* a line is one dash as long as the longest line; sliding the dash in makes every line grow from its start */
  .web { stroke-dasharray: var(--web) var(--web); transition: stroke-dashoffset 450ms cubic-bezier(.45, 0, .85, .55), opacity 200ms linear; }
  .fan { stroke-dasharray: var(--fan) var(--fan); transition: stroke-dashoffset 800ms cubic-bezier(.45, 0, .7, .7), opacity 200ms linear; }
  .no-web .web { stroke-dashoffset: var(--web); }
  .no-fan .fan { stroke-dashoffset: var(--fan); }
  .halo { fill-opacity: var(--nar-halo); }
  .n-attack { fill: var(--n-attack); } .n-dg { fill: var(--n-dg); } .n-july { fill: var(--n-july); } .n-story { fill: var(--n-story); } .n-praise { fill: var(--n-praise); }
  /* bridge lines: those crossing from the BGB side of the graph to the JRA side; drawn last and a little stronger */
  .bridge { stroke-dasharray: var(--bridge) var(--bridge); transition: stroke-dashoffset 1100ms cubic-bezier(.45, 0, .6, .8), opacity 200ms linear; }
  .no-bridge .bridge { stroke-dashoffset: var(--bridge); }
  .edges.bridge { stroke-opacity: calc(var(--edge-alpha) * 1.9); stroke-width: 0.6; }
  /* the replay's effects: same-second sparks, rapid-fire ripples, and their ticks on the timeline */
  #fx { pointer-events: none; }
  .spark { fill: none; stroke: var(--spark); stroke-width: 1.6; transform-box: fill-box; transform-origin: center; animation: spark 1100ms ease-out both; }
  .spark-line { stroke: var(--spark); stroke-width: 1.6; stroke-linecap: round; animation: fadeline 1300ms ease-out both; }
  .ripple { fill: none; stroke-width: 1; transform-box: fill-box; transform-origin: center; animation: ripple 750ms ease-out both; }
  .ripple.c-BGB { stroke: var(--bgb); } .ripple.c-JRA { stroke: var(--jra); } .ripple.c-both { stroke: var(--both); }
  .ripple { fill: none; }
  @keyframes spark { from { transform: scale(1); opacity: 1; } to { transform: scale(2.6); opacity: 0; } }
  @keyframes ripple { from { transform: scale(1); opacity: 0.7; } to { transform: scale(2.1); opacity: 0; } }
  @keyframes fadeline { 0% { opacity: 0; } 15% { opacity: 0.95; } 100% { opacity: 0; } }
  .stick { stroke: var(--spark); stroke-width: 1; transition: opacity 250ms; }
  .playing .stick:not(.on) { opacity: 0; }
  #halos { transition: opacity 900ms ease; }
  .e-BGB { stroke: var(--edge-bgb); } .e-JRA { stroke: var(--edge-jra); } .e-both { stroke: var(--edge-both); }
  .link { fill: none; stroke-linecap: round; stroke-opacity: 0.55; }
  .focus-edges { fill: none; stroke-width: 0.7; opacity: 0.7; }
  .node { stroke: var(--surface); stroke-width: 1.1; transform-box: fill-box; transform-origin: center;
          transition: transform 420ms cubic-bezier(.2, 1.7, .4, 1), opacity 200ms linear; }
  .c-BGB { fill: var(--bgb); } .c-JRA { fill: var(--jra); } .c-both { fill: var(--both); }
  .node.hot { stroke: var(--ink); stroke-width: 2; }
  .dim { opacity: 0.12; }
  .faded { opacity: 0.03 !important; }
  .name { transition: opacity 200ms linear; }
  .name:not(.always):not(.show) { opacity: 0; }   /* most names appear only when their account is talked about or hovered */

  /* stages of the animation: lines, names and callouts are held back until their turn */
  .callout, #playhead { transition: opacity 700ms ease; }
  .no-edges #halos, .no-edges .name:not(.show), .no-notes .callout, .settled #playhead { opacity: 0; }
  .snap #halos, .snap .edges, .snap .link, .snap .name, .snap .callout, .snap .node { transition: none; }
  .one-note .callout:not(.now) { opacity: 0; }
  .one-note.stacked .callout:not(.now) { opacity: 0.25; }

  .head { font-size: 20px; font-weight: 800; letter-spacing: -0.02em; fill: var(--ink); }
  .dek { font-size: 12.5px; fill: var(--ink-2); }
  .chip { font-size: 10.5px; font-weight: 700; letter-spacing: 0.02em; fill: var(--ink); text-anchor: middle; opacity: 0; transition: opacity 300ms; }
  .playing .chip { opacity: 1; }
  .stacked.playing .note { opacity: 0; }
  #striptitle { transition: opacity 300ms; }
  .playing #striptitle { opacity: 0; }

  /* a panel's marker and connector, drawn in the colour of the post it is about so they read as part of the graph */
  .t-BGB { --tone: var(--bgb); } .t-JRA { --tone: var(--jra); } .t-both { --tone: var(--both); }
  .spot { fill: var(--tone); fill-opacity: 0.10; stroke: var(--tone); stroke-width: 1.4; }
  .spot-pulse { fill: none; stroke: var(--tone); stroke-width: 1.4; transform-box: fill-box; transform-origin: center; animation: pulse 1.8s ease-out infinite; }
  .lead { stroke: var(--tone); stroke-width: 1.4; fill: none; stroke-linecap: round; stroke-dasharray: 400; animation: draw 520ms ease-out both; }
  .lead-end { fill: var(--tone); stroke: var(--paper); stroke-width: 1.5; }
  @keyframes pulse { from { transform: scale(1); opacity: 0.75; } to { transform: scale(1.4); opacity: 0; } }
  @keyframes draw { from { stroke-dashoffset: 400; } to { stroke-dashoffset: 0; } }

  /* the story panels: a paper card under a rule in the post's colour, like a printed annotation */
  .card {
    position: absolute; z-index: 4; pointer-events: none; width: min(264px, calc(100% - 24px));
    background: var(--paper); border: 1px solid var(--rule); border-top: 3px solid var(--tone); border-radius: 2px 2px 4px 4px;
    padding: 12px 16px 14px; box-shadow: var(--card-shadow);
    opacity: 0; transform: scale(0.86); transition: opacity 550ms ease, transform 800ms cubic-bezier(.2, 1.3, .3, 1);
  }
  .card.open { opacity: 1; transform: none; }
  .tone-BGB { --tone: var(--bgb); } .tone-JRA { --tone: var(--jra); } .tone-both { --tone: var(--both); }
  .card .eyebrow { display: flex; align-items: center; gap: 7px; font-size: 10px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-2); }
  .card .eyebrow::before { content: ""; flex: none; width: 7px; height: 7px; border-radius: 50%; background: var(--tone); }
  .card .figure { margin-top: 8px; }
  .card .num { display: block; font-size: 42px; line-height: 0.95; font-weight: 800; letter-spacing: -0.035em; color: var(--tone); font-variant-numeric: lining-nums; }
  .card .unit { display: block; margin-top: 6px; font-size: 13.5px; line-height: 1.3; font-weight: 700; color: var(--ink); }
  .card h3 { margin: 8px 0 0; font-size: 17px; line-height: 1.22; font-weight: 800; letter-spacing: -0.015em; color: var(--ink); }
  .card p { margin: 7px 0 0; font-size: 12.5px; line-height: 1.5; color: var(--ink-2); }
  .card blockquote { position: relative; margin: 11px 0 0; padding: 10px 0 0 22px; border-top: 1px solid var(--rule); font-size: 12.5px; line-height: 1.45; color: var(--ink); }
  .card blockquote::before { content: "“"; position: absolute; left: -1px; top: 5px; font-size: 34px; line-height: 1; font-weight: 800; color: var(--tone); }
  .card cite { display: block; margin-top: 5px; font-size: 10.5px; font-style: normal; font-weight: 600; letter-spacing: 0.02em; color: var(--muted); }
  @media (prefers-reduced-motion: reduce) { .card { transition: none; } .spot-pulse, .lead { animation: none; } }
  .key { font-size: 11.5px; fill: var(--ink-2); }
  .key .n { font-weight: 700; fill: var(--ink); }
  .name { font-size: 10px; font-weight: 600; fill: var(--ink); paint-order: stroke; stroke: var(--surface); stroke-width: 3px; stroke-linejoin: round; pointer-events: none; }
  .note { font-size: 10px; fill: var(--muted); }
  .call-t { font-size: 11.5px; font-weight: 700; fill: var(--ink); }
  .call-b { font-size: 10.5px; fill: var(--ink-2); }
  .area { fill-opacity: 0.9; }
  .pointer { stroke: var(--ink); stroke-width: 0.8; fill: none; }
  .ring { stroke: var(--ink); stroke-width: 1; fill: none; stroke-dasharray: 2.5 2.5; pointer-events: none; }
  .badge { fill: var(--ink); stroke: var(--surface); stroke-width: 1.5; }
  .badge-n { font-size: 9.5px; font-weight: 700; fill: var(--surface); text-anchor: middle; dominant-baseline: central; pointer-events: none; }

  .axis { stroke: var(--hairline); stroke-width: 1; }
  .tick { font-size: 9.5px; fill: var(--muted); text-anchor: middle; }
  .mark { stroke: var(--ink); stroke-width: 0.8; }
  .mark-t { font-size: 9.5px; font-weight: 600; fill: var(--ink); }
  #playhead { stroke: var(--ink); stroke-width: 1.2; }

  .bar { display: flex; justify-content: center; padding: 2px 0 8px; }
  .bar button { font: inherit; font-size: 12px; color: var(--ink-2); background: transparent; border: 1px solid var(--border); border-radius: 999px; padding: 5px 12px; cursor: pointer; }
  .bar button:hover { background: var(--hairline); }
  .bar button:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }

  .tip {
    position: absolute; z-index: 5; pointer-events: none; display: none;
    width: max-content; max-width: min(290px, calc(100% - 16px));
    /* see-through, so the hovered account's lines (drawn above it, in #over) can be followed across the box */
    background: color-mix(in srgb, var(--paper) 74%, transparent); -webkit-backdrop-filter: blur(2px); backdrop-filter: blur(2px);
    color: var(--ink); border: 1px solid var(--rule); border-top: 3px solid var(--tone, var(--ink));
    border-radius: 2px 2px 4px 4px; box-shadow: var(--card-shadow); padding: 10px 12px; font-size: 12.5px; line-height: 1.4;
  }
  #over { position: absolute; left: 0; top: 0; z-index: 6; pointer-events: none; }
  /* phones: a solid box on top, as there is no room to read text through the lines */
  .phone #over { z-index: 3; }
  .phone .tip { background: var(--paper); -webkit-backdrop-filter: none; backdrop-filter: none; }
  .tip strong { display: block; font-size: 13.5px; }
  .tip .sub { color: var(--ink-2); }
  .tip .link { margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--border); }
  .tip .when { font-weight: 600; }
  .tip .quote { color: var(--ink-2); margin-top: 2px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .tip .more { color: var(--muted); margin-top: 6px; }
  @media (prefers-reduced-motion: reduce) { .node, #edges, #names, .callout { transition: none; } }
</style>
</head>
<body>
<div class="chart" id="chart">
  <svg id="svg" role="img"></svg>
  <div id="cards" aria-live="polite"></div>
  <div class="tip" id="tip" role="status"></div>
  <svg id="over" aria-hidden="true"></svg>
</div>
<div class="bar"><button type="button" id="replay">Replay</button></div>

const DATA = {"w":782,"h":428,"texts":[{"i":0,"bn":"বিজিবি সব সময়ই মানবিকতার সাথে রয়েছে, মহাপরিচালক স্যারের নির্দেশনায় বিজিবি অত্যন্ত সুশৃঙ্খলভাবে দেশের সেবা করে যাচ্ছে।","en":"BGB has always stood firmly with humanitarian values. Under the visionary guidance of the Director General, the force continues to serve the nation with utmost discipline and dedication.","comments":92,"nar":"dg","profiles":39,"on":{"BGB":0,"JRA":39},"jra_share":1.0,"cx":601.6,"cy":56.6,"cr":49.4},{"i":1,"bn":"বিজিবির মহাপরিচালকের দক্ষ নেতৃত্বে বাহিনীর পেশাদারিত্ব, শৃঙ্খলা ও জনকল্যাণমূলক কার্যক্রম বর্তমানে দৃশ্যমান। উদ্দেশ্য প্রণোদিত ভিত্তিহীন সংবাদের তীব্র প্রতিবাদ জানাই।","en":"Under the skilled leadership of the Director General of BGB, the force's professionalism, discipline, and public welfare activities are clearly visible today. I strongly protest against these motivated and baseless news reports.","comments":74,"nar":"attack","profiles":74,"on":{"BGB":74,"JRA":0},"jra_share":0.0,"cx":369.2,"cy":128.1,"cr":52.9},{"i":2,"bn":"সম্মানিত বিজিবি মহাপরিচালক মহোদয় একজন অত্যন্ত সৎ, দক্ষ, প্রজ্ঞাবান ও চৌকস অভিভাবক। স্যারের যোগ্য ও দূরদর্শী নেতৃত্বে আমরা বিজিবি পরিবার সীমান্তে অত্যন্ত নিষ্ঠা ও সচেতনতার সাথে দায়িত্ব পালন করে যাচ্ছি। দেশের সার্বভৌমত্ব ও নিরাপত্তা রক্ষায় আমরা বিন্দুমাত্র ছাড় দেব না। মহান আল্লাহর কাছে দোয়া করি, আল্লাহ যেন আমাদের প্রিয় মহাপরিচালক মহোদয় স্যার ও তাঁর পরিবারকে সর্বদা সুস্থতা, নিরাপত্তা ও মঙ্গল দান করেন। আমিন। সম্মানিত মহাপরিচালক মহোদয়ের বিরুদ্ধে উদ্দেশ্যপ্রণোদিত ও মিথ্যা প্রতিবেদনের তীব্র নিন্দা ও প্রতিবাদ জানাচ্ছি।","en":"","comments":42,"nar":"attack","profiles":41,"on":{"BGB":33,"JRA":9},"jra_share":0.21,"cx":360.2,"cy":233.6,"cr":39.6},{"i":3,"bn":"উদ্দেশ্য প্রণোদিত ভিত্তিহীন বানোয়াট প্রতিবেদনের তীব্র নিন্দা জানাই , বর্তমান বিজিবি মহাপরিচালক স্যার এ বাহিনীর সর্বকালের সেরা মহাপরিচালক ❤️❤️","en":"I strongly condemn this motivated, baseless, and fabricated report; the current Director General of BGB is the best DG this force has ever had. ❤️❤️","comments":42,"nar":"attack","profiles":42,"on":{"BGB":42,"JRA":0},"jra_share":0.0,"cx":61.8,"cy":170.9,"cr":42.2},{"i":4,"bn":"জুলাই গণঅভ্যুত্থানের কঠিন সময়ে বিজিবির দায়িত্বশীলতা, সংযম ও মানবিক ভূমিকা সত্যিই প্রশংসনীয়। মানুষের পাশে থাকার এই মানবিকতাই বিজিবির প্রতি আস্থা ও শ্রদ্ধা আরও বাড়ায়।","en":"During the critical period of the July mass uprising, BGB's sense of responsibility, restraint, and humanitarian commitment were truly praiseworthy. Standing by the people in their time of need reinforces our trust and deep respect for the force.","comments":38,"nar":"july","profiles":22,"on":{"BGB":0,"JRA":22},"jra_share":1.0,"cx":433.6,"cy":204.6,"cr":42.2},{"i":5,"bn":"বিজিবির দায়িত্ব সীমান্ত পাহারা দেওয়া, তবে দেশের মানুষের প্রতি মানবিক দায়িত্বও অত্যন্ত গুরুত্বপূর্ণ। বিপদের সময়ে একজন অসহায় মানুষের পাশে দাঁড়ানো, তাকে আশ্রয় দেওয়া এবং প্রয়োজনীয় সেবা নিশ্চিত করার ঘটনা সাধারণ মানুষের কাছে বাহিনীর মানবিক ভাবমূর্তি আরও শক্তিশালী করে। এমন ইতিবাচক ও মানবিক কর্মকাণ্ডের মাধ্যমে বিজিবি ও জনগণের মধ্যে পারস্পরিক আস্থা আরও গভীর হোক—এটাই প্রত্যাশা।","en":"While safeguarding borders is BGB's core mandate, upholding humanitarian duty toward citizens is equally vital. Supporting vulnerable individuals, offering shelter, and delivering essential aid reinforce the force's compassionate identity. May such endeavors continue to foster deep mutual trust between BGB and the public.","comments":37,"nar":"july","profiles":5,"on":{"BGB":0,"JRA":5},"jra_share":1.0,"cx":508.1,"cy":258.1,"cr":24.0},{"i":6,"bn":"বিজিবি মহাপরিচালক একজন নিতি নিষ্ঠাবান ব্যক্তি তিনি যেভাবে বিজিবিকে নিয়ে মহা পরিকল্পনা গ্রহণ করেছেন তা অত্যন্ত প্রশংসার , এমন খবর ছড়ানোর তীব্র নিন্দা ও প্রতিবাদ জানাই।","en":"The Director General of BGB is a person of high integrity and dedication. His comprehensive master plan for BGB is highly commendable; I strongly condemn and protest the dissemination of such news.","comments":36,"nar":"attack","profiles":36,"on":{"BGB":36,"JRA":0},"jra_share":0.0,"cx":327.8,"cy":331.3,"cr":36.6},{"i":7,"bn":"একজন আহত   // (a panel pushed back onto its own spot by the edge of the frame is the worst case)
  const onSpot = ([x, y]) => Math.hypot(ax - Math.max(x, Math.min(x + w, ax)), ay - Math.max(y, Math.min(y + hgt, ay))) < ar + gap - 2;
  const hides = p => accounts.reduce((n, q) => {
    const qx = q.px * k, qy = q.py * k, inside = (x, y, pad) => x > p[0] - pad && x < p[0] + w + pad && y > p[1] && y < p[1] + hgt;
    if (q.tag && q.tag.classList.contains('show') && inside(q.tag.getAttribute('x') * k, q.tag.getAttribute('y') * k, 40)) n += 400;   // a name this panel talks about
    return !inside(qx, qy, 0) || (playing && !q.seen) ? n : n + (q.dot.classList.contains('dim') ? 1 : 25);
  }, spec.over || !onSpot(p) ? 0 : 5000);
  let spots;
  if (spec.over) spots = [fit(ax - w / 2, ay - hgt / 2)];
  else if (spec.when != null) spots = [fit(ax - 22, ay - ar - gap - hgt)];   // planted above its moment on the timeline, like a flag
  else {
    const beside = [fit(ax + ar + gap, ay - hgt / 2), fit(ax - ar - gap - w, ay - hgt / 2)];
    const stacked = [fit(ax - w / 2, ay + ar + gap), fit(ax - w / 2, ay - ar - gap - hgt)];
    spots = box.width >= 620 ? beside.concat(stacked) : stacked.concat(beside);   // wide: beside first; narrow: below or above first
  }
  const [x, y] = spots.sort((p, q) => hides(p) - hides(q))[0];
  card.style.left = x + 'px'; card.style.top = y + 'px';
  card.style.transformOrigin = (ax - x) + 'px ' + (ay - y) + 'px';   // it grows out of the spot
  if (spec.over) return;
  // marker and connector, in the graph's own coordinates: a tinted ring on the accounts, a curved lead to the panel's nearest edge
  const tone = 't-' + spec.tone, r = spec.r + 5;
  const nx = Math.max(x, Math.min(x + w, ax)) / k, ny = Math.max(y, Math.min(y + hgt, ay)) / k;
  const d = Math.hypot(nx - a.px, ny - a.py) || 1, ux = (nx - a.px) / d, uy = (ny - a.py) / d;
  // one ring per thing the panel is about: every account in spec.marks, otherwise the single spot
  for (const [mx, my, mr] of spec.marks || [[spec.x, spec.y, spec.r]]) {
    const q = spec.when != null ? a : toView({ x: mx, y: my });
    if (spec.when != null) el('path', { class: 'lead ' + tone, d: `M${a.px},${a.py + mr + 5}L${a.px},${strip.mark}` }, gStory);   // down to the post's marker
    el('circle', { class: 'spot-pulse ' + tone, cx: q.px, cy: q.py, r: mr + 5 }, gStory);
    el('circle', { class: 'spot ' + tone, cx: q.px, cy: q.py, r: mr + 5 }, gStory);
  }
  if (d > r + 4) {
    const sx = a.px + ux * r, sy = a.py + uy * r, bend = Math.min(14, (d - r) * 0.3);
    el('path', { class: 'lead ' + tone, d: `M${sx.toFixed(1)},${sy.toFixed(1)}Q${((sx + nx) / 2 - uy * bend).toFixed(1)},${((sy + ny) / 2 + ux * bend).toFixed(1)} ${nx.toFixed(1)},${ny.toFixed(1)}` }, gStory);
    el('circle', { class: 'lead-end ' + tone, cx: nx, cy: ny, r: 3.2 }, gStory);
  }
}
function showCards(specs) {
  for (const spec of specs) {
    const card = h('div', 'card tone-' + spec.tone, null, $('cards'));
    if (spec.eyebrow) h('div', 'eyebrow', spec.eyebrow, card);
    if (spec.figure) { const f = h('div', 'figure', null, card); h('span', 'num', spec.figure, f); h('span', 'unit', spec.unit, f); }
    if (spec.title) h('h3', '', spec.title, card);
    if (spec.body) h('p', '', spec.body, card);
    if (spec.quote) { const q = h('blockquote', '', spec.quote, card); if (spec.cite) h('cite', '', spec.cite, q); }
    placeCard(card, spec);
    card.getBoundingClientRect();   // start from the closed state so the opening animates
    card.classList.add('open');
    openCards.push({ card, spec });
  }
}
function hideCards(now) {
  for (const { card } of openCards) { card.classList.remove('open'); now ? card.remove() : setTimeout(() => card.remove(), 320); }
  openCards = [];
  gStory.textContent = '';
}

function settle() {
  run++; playing = false;
  hideCards(true);
  svg.classList.add('snap');   // jump straight to the finished picture
  svg.classList.remove(...STAGES); svg.classList.add('settled');
  frame(false);
  for (const a of accounts) { a.dot.style.transform = ''; if (a.tag) a.tag.classList.remove('show'); }
  light(null);
  svg.getBoundingClientRect(); svg.classList.remove('snap');
  $('replay').textContent = 'Replay';
}

async function play() {
  const id = ++run;
  playing = true; hideTip(); hideCards(true); light(null);
  $('replay').textContent = 'Skip';
  svg.classList.remove(...STAGES); svg.classList.add('no-edges', 'no-web', 'no-fan', 'no-bridge', 'no-notes', 'playing', 'snap');
  frame(true);
  for (const a of accounts) { a.seen = 0; a.last = -1e9; a.dot.style.transform = 'scale(0)'; }
  for (const t of strip.sticks) t.classList.remove('on');
  svg.getBoundingClientRect();   // apply the empty state at once, then let later changes ease in
  svg.classList.remove('snap');

  // the replay runs the clock forward to a given minute, adding each comment as its time comes
  let minute = 0, next = 0, count = 0, nextSync = 0;
  // `atLeast` stretches a stretch of time so the panel that is open can be read while the comments keep arriving
  const advance = (to, atLeast) => new Promise(done => {
    const from = minute, w0 = weightAt(from), w1 = weightAt(to);
    const ms = Math.max(250, atLeast || 0, Math.min(7000, w1 - w0)), began = performance.now();
    (function frame(now) {
      if (run !== id) return done(false);
      const t = Math.min(1, (now - began) / ms);
      minute = t >= 1 ? to : w1 - w0 > 0.01 ? Math.max(from, Math.min(to, minuteAt(w0 + (w1 - w0) * t))) : from + (to - from) * t;
      while (next < events.length && events[next][0] <= minute) {
        const [at, a] = events[next++];
        count++;
        a.dot.style.transform = `scale(${(radius(++a.seen) / a.r).toFixed(3)})`;
        if (at - a.last < RAPID) ripple(a);
        a.last = at;
      }
      while (nextSync < SYNC.length && SYNC[nextSync][0] <= minute) {
        spark(SYNC[nextSync][1]);
        strip.sticks[nextSync++].classList.add('on');
      }
      // the clock rides along the timeline with the playhead
      const shown = Math.min(minute, LAST), x = strip.x(shown);
      strip.line.setAttribute('x1', x); strip.line.setAttribute('x2', x);
      strip.chip.setAttribute('x', Math.max(strip.x0 + 112, Math.min(strip.x1 - 112, x)));
      strip.chip.textContent = clock(Math.floor(shown / 5) * 5, true) + ' · ' + plural(count, 'copied comment');
      t < 1 ? requestAnimationFrame(frame) : done(true);
    })(began);
  });
  // long enough to read the panels
  const reading = c => {
    const ms = Math.min(7000, 2200 + 33 * c.cards.reduce((n, k) => n + [k.eyebrow, k.figure, k.unit, k.title, k.body, k.quote, k.cite].join('').length, 0));
    const k = timed.indexOf(c);
    return ms * (k >= 0 && k < 2 ? 0.6 : 0.38);   // seven boxes follow the JRA post going up, so each one is kept shorter
  };

  // a panel stays open until the next one takes its place; the clock never stops
  const swap = c => {
    hideCards();
    for (const a of accounts) if (a.tag) a.tag.classList.remove('show');
    for (const i of c.focus || []) if (accounts[i].tag) accounts[i].tag.classList.add('show');
    showCards(c.cards);
  };
  const timed = STORY.chapters.filter(c => c.at != null), after = STORY.chapters.filter(c => c.at == null);
  let open = null;
  for (const c of timed) {
    if (!await advance(c.at, open && reading(open))) return;
    swap(open = c);
  }
  if (!await advance(LAST + 1, open && reading(open))) return;

  // once every comment is in: the summary, the lines, and what ties the two posts together
  for (const c of after) {
    if (c.reveal === 'edges') {   // the lines draw themselves: inside each cluster first, then out across the graph
      svg.classList.remove('no-edges', 'no-web');
      setTimeout(() => { if (run === id) svg.classList.remove('no-fan'); }, 400);
      setTimeout(() => { if (run === id) svg.classList.remove('no-bridge'); }, 1300);   // the lines joining the two posts come last
    }
    if (c.spot && c.spot.text != null) light(new Set(members[c.spot.text]), null, c.spot.text);
    else if (c.spot) light(new Set(accounts.filter(a => a.color === c.spot.color)));
    else light(null);
    swap(c);
    if (!await wait(reading(c), id)) return;
  }
  settle();
}

// ---- hover / tap once the animation has settled: nearest circle within reach
const tip = $('tip'), chart = $('chart');
let current = null;

function pick(evt) {
  const box = svg.getBoundingClientRect(), k = view.w / box.width;
  const x = (evt.clientX - box.left) * k, y = (evt.clientY - box.top) * k;
  let best = null, bestD = 8 * k;
  for (const a of accounts) {
    const d = Math.hypot(a.px - x, a.py - y) - a.r;
    if (d < bestD) { best = a; bestD = d; }
  }
  return best;
}

function fillTip(a) {
  tip.textContent = '';
  h('strong', '', a.name, tip);
  h('div', 'sub', plural(a.total, 'copied comment') + ' on ' + a.posts.map(p => POSTS[p]).join(' and '), tip);
  a.links.slice(0, 3).forEach(l => {
    const t = DATA.texts[l.t], box = h('div', 'link', null, tip);
    h('div', 'when', l.n > 1 ? 'Posted ' + l.n + ' times, ' + l.first + ' to ' + l.last : 'Posted once, ' + l.first, box);
    h('div', 'quote', '“' + (t.en || t.bn) + '”', box);
    h('div', 'sub', 'Same text from ' + plural(t.profiles, 'profile') + ', ' + plural(t.comments, 'comment'), box);
  });
  if (a.links.length > 3) h('div', 'more', '+ ' + plural(a.links.length - 3, 'more copied text'), tip);
}

function showTip(a, evt) {
  if (a !== current) { current = a; fillTip(a); light(peersOf(a), a); tip.className = 'tip tone-' + a.color; }
  tip.style.display = 'block';
  const box = chart.getBoundingClientRect(), k = box.width / view.w, tw = tip.offsetWidth, th = tip.offsetHeight;
  const px = evt.clientX - box.left, py = evt.clientY - box.top, peers = [...peersOf(a)];
  // put the box on the side the lines are NOT going: sample points along every line from this account, and
  // take the corner around the pointer whose box those points cross least (ties go to the corner opposite the lines)
  const fit = (x, y) => [Math.max(4, Math.min(box.width - tw - 4, x)), Math.max(4, Math.min(box.height - th - 4, y))];
  const along = [];
  let sx = 0, sy = 0;
  for (const q of peers) {
    if (q === a) continue;
    // the long lines decide; the short ones to neighbours in the account's own cluster count for little
    const far = Math.hypot(q.px - a.px, q.py - a.py) > 70 ? 1 : 0.1;
    sx += (q.px - a.px) * far; sy += (q.py - a.py) * far;
    const cx = (a.px + q.px) / 2 - (q.py - a.py) * 0.28, cy = (a.py + q.py) / 2 + (q.px - a.px) * 0.28;   // the same curve as arc()
    for (let t = 0.12; t <= 1; t += 0.11) {
      const u = 1 - t;
      along.push([(u * u * a.px + 2 * u * t * cx + t * t * q.px) * k, (u * u * a.py + 2 * u * t * cy + t * t * q.py) * k, far]);
    }
  }
  const crossed = ([x, y]) => along.reduce((n, p) => n + (p[0] > x && p[0] < x + tw && p[1] > y && p[1] < y + th ? p[2] : 0), 0);
  const left = sx > 0, up = sy > 0;   // lines head right -> box goes left; lines head down -> box goes up
  const corner = (l, u) => fit(l ? px - tw - 14 : px + 14, u ? py - th - 14 : py + 14);
  const [x, y] = [corner(left, up), corner(left, !up), corner(!left, up), corner(!left, !up)]
    .map((p, i) => [p, crossed(p) + i * 0.01]).sort((p, q) => p[1] - q[1])[0][0];
  tip.style.left = x + 'px';
  tip.style.top = y + 'px';
}
function hideTip() {
  if (!current) return;
  current = null; tip.style.display = 'none'; over.textContent = '';
  if (!playing) light(null);
}
function point(e) {
  if (playing) return;
  const a = pick(e);
  a ? showTip(a, e) : hideTip();
  svg.style.cursor = a ? 'pointer' : '';
}
svg.addEventListener('pointermove', point);
svg.addEventListener('pointerdown', point);
svg.addEventListener('pointerleave', e => { if (e.pointerType === 'mouse') hideTip(); });
$('replay').addEventListener('click', () => playing ? settle() : play());
if (STATIC) $('replay').parentNode.style.display = 'none';

// ---- responsive: redraw only when crossing the breakpoint; report height to the host page
function fit() {
  const p = chart.clientWidth < 620;
  chart.classList.toggle('phone', p);
  if (p !== portrait) { portrait = p; current = null; tip.style.display = 'none'; render(p); settle(); }
  else if (openCards.length) { gStory.textContent = ''; for (const { card, spec } of openCards) placeCard(card, spec); }   // keep open panels on their spot
  tellHost();
}
addEventListener('resize', fit);
fit();

// start the first time the graph scrolls into view
if (!STATIC && !CALM) {
  if ('IntersectionObserver' in window) {
    const seen = new IntersectionObserver(entries => {
      if (entries.some(e => e.isIntersecting)) { seen.disconnect(); play(); }
    }, { threshold: 0.35 });
    seen.observe(chart);
  } else play();
}
</script>
